---
name: Tests
on:
  push:
  pull_request:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.10'
      - name: Install requirements
        run: pip install flake8 pycodestyle
      - name: Check syntax
        run: flake8 . --count --select=E901,E999,F821,F822,F823 --show-source --statistics --extend-exclude ckan

  test:
    needs: lint
    # Tested against the PostgreSQL-only CKAN branch
    # (https://github.com/parripollo/ckanito): no Solr, no Redis, no CKAN
    # docker image. CKAN is cloned and installed from source in the job.
    name: CKAN PostgreSQL only (parripollo/ckanito master)
    runs-on: ubuntu-latest
    container:
      image: python:3.10-bookworm
    services:
      ckan-postgres:
        image: postgres:16
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_USER: ckan
          POSTGRES_PASSWORD: ckan
    env:
      CKAN_REPO: https://github.com/parripollo/ckanito.git
      CKAN_BRANCH: master
      CKAN_SRC: /srv/app/src/ckan
      PGPASSWORD: ckan
      PGHOST: ckan-postgres
      PGUSER: ckan

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install CKAN from source
      run: |
        apt-get update && apt-get install -y postgresql-client
        git clone --depth 1 --branch "$CKAN_BRANCH" "$CKAN_REPO" "$CKAN_SRC"
        pip install -U pip setuptools
        pip install -r "$CKAN_SRC/requirements.txt" -r "$CKAN_SRC/dev-requirements.txt"
        pip install -e "$CKAN_SRC"

    - name: Create the test databases
      run: |
        psql -c "CREATE USER ckan_default WITH PASSWORD 'pass' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
        psql -c "CREATE USER datastore_read WITH PASSWORD 'pass' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
        psql -c "CREATE USER datastore_write WITH PASSWORD 'pass' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
        createdb --encoding=utf-8 --owner=ckan_default ckan_test
        createdb --encoding=utf-8 --owner=datastore_write datastore_test
        cd "$CKAN_SRC"
        ckan -c test-core-ci.ini datastore set-permissions | psql
        psql --dbname=datastore_test -c "CREATE EXTENSION tablefunc;"

    - name: Install the extension
      run: |
        pip install -r requirements.txt
        pip install -r dev-requirements.txt
        pip install -e .
        pip install -U requests[security]
        sed -i -e "s#use = config:.*#use = config:$CKAN_SRC/test-core-ci.ini#" test.ini

    - name: Setup extension
      run: |
        ckan -c test.ini db init
        ckan -c test.ini user add ckan_admin email=ckan_admin@localhost password="AbCdEf12345!@#%"
        ckan -c test.ini sysadmin add ckan_admin
        ckan config-tool test.ini "ckanext.xloader.api_token=$(ckan -c test.ini user token add ckan_admin xloader | tail -n 1 | tr -d '\t')"
        ckan -c test.ini user list

    - name: Run tests
      run: pytest --ckan-ini=test.ini --cov=ckanext.xloader --disable-warnings ckanext/xloader/tests
